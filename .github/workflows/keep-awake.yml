name: keep-awake

# Keeps the Streamlit Community Cloud app from sleeping. A real headless
# browser (not an HTTP ping) establishes the session Streamlit actually counts.
# Public repo => Actions minutes are free and unlimited.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (Streamlit sleeps after ~12h idle)
  workflow_dispatch:          # lets you run it on demand from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
